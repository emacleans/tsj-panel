<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaceta · Avance</title>
<style>
:root{--navy:#263449;--bg:#E9E5DC;--card:#F9F7F2;--line:#DAD5C8;--ink:#1F2733;--muted:#6B7280;--gold:#A67C36;--ok:#3F7D4E;--warn:#B4691F;--bad:#A33B3B;--active:#2F6FB0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font:600 18px Georgia,serif;margin:0;flex:1}
header small{color:#cfd6e2}
main{max-width:1000px;margin:0 auto;padding:16px}
.t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.t h2{font:600 16px Georgia,serif;color:var(--navy);margin:0 0 8px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-size:34px;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.bar{height:16px;background:#E4DFD2;border-radius:8px;overflow:hidden;display:flex;margin:8px 0}
.bar i{display:block;height:100%}
.ok{background:var(--ok)}.rev{background:var(--warn)}.err{background:var(--bad)}
.kpis{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.kpis b{color:var(--ink)}
.eq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-top:8px}
.eq .n{display:flex;gap:8px;align-items:center;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#B9B3A4;display:inline-block}
.on .dot{background:var(--ok)}.work .dot{background:var(--active);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
.m{font-size:12.5px;color:var(--muted);margin-top:3px}
.av{border-left:4px solid var(--warn);background:#FBF1E2;padding:8px 12px;border-radius:6px;margin-top:8px;font-size:13.5px}
.av.alto{border-color:var(--bad);background:#F6DEDE}.av.info{border-color:var(--active);background:#E6EEF8}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11.5px sans-serif;color:var(--muted);text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 8px;border-bottom:1px solid #ECE8DC;text-align:right;font-variant-numeric:tabular-nums}
td.pc{min-width:110px}
.mini{height:8px;background:#E4DFD2;border-radius:4px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ok)}
pre{margin:6px 0 0;background:#1F2733;color:#D8DEE9;border-radius:8px;padding:8px 10px;font-size:11.5px;max-height:170px;overflow:auto;white-space:pre-wrap}
#estado{font-size:12.5px;color:#cfd6e2}
#err{display:none;background:#F6DEDE;border:1px solid #E0B4B4;color:var(--bad);padding:10px 14px;border-radius:10px;margin-bottom:12px}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
@media(max-width:600px){.big b{font-size:26px}}
</style></head><body>
<header><h1>Gaceta Oficial · Avance de la compilación</h1><small id="estado">Conectando…</small><button id="tok" title="Token de GitHub">⚙</button></header>
<main><div id="err"></div><div id="app"><div class="t">Cargando datos de los equipos…</div></div>
<p style="color:var(--muted);font-size:12.5px">Esta página solo lee los datos que ya publican los equipos en GitHub y se actualiza sola cada 30 s. No usa Claude ni gasta crédito. Para detener o iniciar compilaciones, usa el panel central.</p></main>
<script>
const OWNER='emacleans',REPO='tsj-estado',API='https://api.github.com';
const SECC=[['leyes','Leyes',5948],['decretos','Decretos supremos y presidenciales',28214],['decretos_ley','Decretos ley',1340],['sentencias','Sentencias constitucionales (Gaceta)',41],['resoluciones','Resoluciones supremas',4552],['dep_1','Departamental · La Paz',15234],['dep_2','Departamental · Santa Cruz',499],['dep_3','Departamental · Cochabamba',3332],['dep_4','Departamental · Potosí',505],['dep_5','Departamental · Chuquisaca',1694],['dep_6','Departamental · Oruro',639],['dep_7','Departamental · Tarija',2826],['dep_8','Departamental · Beni',27]];
const ETQ=Object.fromEntries(SECC.map(s=>[s[0],s[1]]));ETQ.departamental='Departamental (8 gobernaciones)';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number(n||0).toLocaleString('es-BO');
const pct=(a,b)=>b?(Math.floor(1000*a/b)/10).toLocaleString('es-BO',{minimumFractionDigits:1}):'0,0';
const ahora=()=>Math.floor(Date.now()/1000);
const enLinea=e=>ahora()-e.ts<150;
function hace(ts){const s=Math.max(0,ahora()-ts);return s<90?s+' s':s<5400?Math.round(s/60)+' min':s<172800?Math.round(s/3600)+' h':Math.round(s/86400)+' d'}
function dur(seg){if(seg==null||!isFinite(seg))return '—';const h=seg/3600;if(h<1)return Math.max(1,Math.round(seg/60))+' min';if(h<48)return h.toFixed(1).replace('.',',')+' h';return Math.round(h/24)+' días'}
function leer(k){try{return localStorage.getItem(k)}catch(e){return null}}
let TOKEN=leer('tsj_token'),CACHE={},equipos=[],ultimoOk=0,falla='';
async function gh(p,raw){return fetch(API+p,{headers:{Authorization:'token '+TOKEN,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'},cache:'no-cache'})}
async function cargar(){
  if(!TOKEN){throw new Error('Falta el token de GitHub. Ábrelo una vez desde el panel central (mismo navegador) o pulsa ⚙.')}
  const r=await gh(`/repos/${OWNER}/${REPO}/contents/equipos`);
  if(r.status===401)throw new Error('Token inválido o vencido. Pulsa ⚙ para poner uno nuevo.');
  if(r.status===403||r.status===429)throw new Error('GitHub limitó temporalmente las consultas; se muestran los últimos datos y se reintenta solo.');
  if(!r.ok)throw new Error('GitHub respondió HTTP '+r.status);
  const lista=(await r.json()).filter(f=>f.name.endsWith('.json'));
  await Promise.all(lista.map(async f=>{const c=CACHE[f.name];if(c&&c.sha===f.sha)return;const x=await gh(`/repos/${OWNER}/${REPO}/contents/equipos/${f.name}`,true);if(x.ok)CACHE[f.name]={sha:f.sha,datos:await x.json()}}));
  const vivos=new Set(lista.map(f=>f.name));Object.keys(CACHE).forEach(k=>{if(!vivos.has(k))delete CACHE[k]});
  equipos=Object.values(CACHE).map(c=>c.datos).filter(Boolean).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
}
function agregar(){
  const por={};let ritmo=0;
  for(const e of equipos){const g=e.gaceta;if(!g||!g.disponible||!g.por)continue;if(enLinea(e))ritmo+=g.ritmo_min||0;
    for(const [k,v] of Object.entries(g.por)){const c=por[k];if(!c||(v.hechos||0)>(c.hechos||0)||(v.modo==='completo'&&c.modo!=='completo'))por[k]=Object.assign({eid:e.id,enom:e.nombre},v)}}
  const lista=SECC.map(([k,etq,cono])=>{const v=por[k]||{};const esp=v.esperado||v.total||cono;const reg=(k==='resoluciones'||k.startsWith('dep_'));
    return Object.assign({},v,{k,etq,esp,registro:reg,okv:reg?(v.hechos||0):(v.ok||0),hechos:v.hechos||0})});
  const sum=f=>lista.reduce((s,x)=>s+f(x),0);
  return{lista,ritmo,esp:sum(x=>x.esp),hechos:sum(x=>x.hechos),ok:sum(x=>x.okv),rev:sum(x=>x.rev||0),err:sum(x=>(x.inval||0)+(x.fallo||0))};
}
function barra(ok,rev,err,t){const w=v=>Math.min(100,100*v/(t||1)).toFixed(2);return `<div class="bar"><i class="ok" style="width:${w(ok)}%"></i><i class="rev" style="width:${w(rev)}%"></i><i class="err" style="width:${w(err)}%"></i></div>`}
function tarjetaEquipo(e){
  const g=e.gaceta,on=enLinea(e);
  if(!g||!g.disponible)return `<div class="eq"><div class="n"><span class="dot"></span>${esc(e.nombre)}</div><div class="m">Sin módulo Gaceta${on?'':' · desconectado hace '+hace(e.ts)}</div></div>`;
  const ps=g.procesos||[],trab=on&&ps.length;
  let h=`<div class="eq ${on?'on':''} ${trab?'work':''}"><div class="n"><span class="dot"></span>${esc(e.nombre)} <span class="m" style="margin:0">${on?(trab?'compilando':'en línea, sin compilar'):'desconectado hace '+hace(e.ts)}</span></div>`;
  for(const p of ps){const v=(g.por||{})[p.seccion]||{};const esperando=/^(esperando|reintentando|pausa)/.test(v.fase||'');
    const falta=Math.max(0,(v.esperado||0)-(v.hechos||0));const rate=g.ritmo_min||0;
    const eta=(!esperando&&rate>0&&falta>0)?dur(falta/rate*60):'—';
    h+=`<div class="m"><b style="color:var(--ink)">${esc(ETQ[p.seccion]||p.seccion)}</b> (${p.modo==='completo'?'completa':'piloto'}) · iniciada hace ${hace(p.inicio_ts)}</div>`;
    h+=`<div class="m">${esperando?'<b style="color:var(--warn)">⏳ '+esc(v.fase)+'</b> — el script espera y reintenta solo':'Descargando'} · ritmo ${rate?Math.round(rate*60)+' /h':'—'} · quedan ≈ ${eta}</div>`}
  h+=`<div class="m">Script ${esc(g.script||'?')}${g.ultimo_ts?' · último guardado hace '+hace(g.ultimo_ts):''}${g.error?' · <span style="color:var(--bad)">error '+esc(g.error)+'</span>':''}</div>`;
  for(const a of (g.avisos||[]))h+=`<div class="av ${esc(a.nivel||'')}"><b>${esc(a.t||'')}</b><br>${esc(a.d||'')}</div>`;
  if(!on&&ps.length)h+=`<div class="av alto"><b>Desconectado con una compilación en curso</b><br>Hace ${hace(e.ts)} que no reporta. Causas probables: el Mac se durmió o apagó, se cortó la luz o perdió internet.</div>`;
  if((g.log||[]).length)h+=`<details><summary class="m" style="cursor:pointer">Registro reciente</summary><pre>${esc(g.log.slice(-25).join('\n'))}</pre></details>`;
  return h+'</div>';
}
function render(){
  const a=agregar();
  const total=a.esp,pc=pct(a.hechos,total);
  const falta=Math.max(0,total-a.hechos);
    let h=`<div class="t"><h2>Avance total de la Gaceta</h2><div class="big"><b>${pc} %</b><span>${num(a.hechos)} de ${num(total)} normas</span></div>${barra(a.ok,a.rev,a.err,total)}
  <div class="kpis"><span>Correctas <b>${num(a.ok)}</b></span><span>Por revisar <b>${num(a.rev)}</b></span><span>Con error <b>${num(a.err)}</b></span><span>Faltan <b>${num(falta)}</b></span><span>Ritmo conjunto <b>${a.ritmo?Math.round(a.ritmo*60)+' /h':'—'}</b></span></div></div>`;
  h+=`<div class="t"><h2>Equipos</h2>${equipos.map(tarjetaEquipo).join('')||'<div class="m">Sin equipos.</div>'}</div>`;
  h+=`<div class="t"><h2>Avance por sección</h2><div style="overflow-x:auto"><table><tr><th>Sección</th><th>Total</th><th>Correctas</th><th>Revisar</th><th>Error</th><th>Faltan</th><th>%</th><th></th></tr>`+
    a.lista.map(x=>`<tr><td>${esc(x.etq)}</td><td>${num(x.esp)}</td><td>${num(x.okv)}</td><td>${num(x.rev)}</td><td>${num((x.inval||0)+(x.fallo||0))}</td><td>${num(Math.max(0,x.esp-x.hechos))}</td><td>${pct(x.hechos,x.esp)}</td><td class="pc"><div class="mini"><i style="width:${Math.min(100,100*x.hechos/(x.esp||1)).toFixed(1)}%"></i></div></td></tr>`).join('')+`</table></div></div>`;
  $('app').innerHTML=h;
  $('estado').textContent=falla?'⚠ '+falla:'Actualizado hace '+hace(ultimoOk)+' · se refresca solo cada 30 s';
  $('err').style.display=falla?'block':'none';$('err').textContent=falla;
}
async function tick(){
  try{await cargar();ultimoOk=ahora();falla=''}catch(e){falla=e.message||String(e)}
  try{render()}catch(e){$('err').style.display='block';$('err').textContent='Error al dibujar: '+e.message}
}
$('tok').onclick=()=>{const v=prompt('Token de GitHub (se guarda solo en este navegador):');if(v){try{localStorage.setItem('tsj_token',v.trim())}catch(e){}TOKEN=v.trim();tick()}};
tick();setInterval(tick,30000);setInterval(()=>{if(equipos.length)try{render()}catch(e){}},1000);
</script><script>/*UI_TAREA*//* ESTÁNDAR TRANSVERSAL DE RESPONSIVIDAD (Enrique, 17-oct-2026): todo clic muestra AL INSTANTE una tarjeta con
   1) qué tarea está en curso, 2) avance en % con barra, 3) resultado o error, 4) siguiente acción a tomar,
   5) aviso de éxito y la siguiente vista lógica. Se aplica solo a TODO fetch no-silencioso y a todo botón. */
(function(){
if(window.Tarea)return;
const CSS=`#tarea{position:fixed;right:16px;bottom:16px;z-index:2147483000;width:min(440px,94vw);background:#fff;color:#2b2f3a;border:1px solid #c9c3ad;border-left:6px solid #8f6f2a;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);font:14px/1.4 system-ui,sans-serif;display:none;overflow:hidden}
#tarea.ok{border-left-color:#3f6b3f}#tarea.mal{border-left-color:#a33}
#tarea .th{display:flex;justify-content:space-between;gap:8px;padding:10px 14px 4px;font-weight:600}
#tarea .tx{cursor:pointer;opacity:.55;font-weight:400}
#tarea .td{padding:0 14px;color:#555;font-size:13px}
#tarea .tb{margin:8px 14px 4px;height:10px;background:#eee;border-radius:99px;overflow:hidden}
#tarea .tb i{display:block;height:100%;width:0;background:#8f6f2a;transition:width .35s}
#tarea.ok .tb i{background:#3f6b3f}#tarea.mal .tb i{background:#a33}
#tarea .tp{padding:0 14px;font-size:12px;color:#6b7080;display:flex;justify-content:space-between}
#tarea .tr{padding:6px 14px 0;font-weight:600}#tarea.ok .tr{color:#2f5a2f}#tarea.mal .tr{color:#a33}
#tarea .ts{padding:4px 14px 12px;font-size:13px;background:#faf8f0;margin-top:8px;border-top:1px solid #eee;padding-top:8px}
#tconf{position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
#tconf div{background:#fff;border-radius:12px;padding:18px;max-width:min(480px,92vw);font:15px/1.45 system-ui,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#tconf button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid #8f6f2a;background:#fff;color:#8f6f2a;cursor:pointer;margin:12px 8px 0 0}#tconf button.p{background:#8f6f2a;color:#fff}
button.t-ocupado{opacity:.6;pointer-events:none}`;
const st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st);
const box=document.createElement('div');box.id='tarea';document.body.appendChild(box);
const SILENT=[/\/api\/borrador/,/\/api\/progreso/,/\/api\/imagen/,/\/api\/captura/,/\/api\/estado_proceso/,/\/api\/cotejo_estado/,/\/api\/avance/,/\/api\/gestiones?\b/];
/* etiqueta, siguiente acción si sale bien, ruta de progreso (si existe) */
const MAPA=[
 [/api\.github\.com\/.*(contents|dispatches|issues)/,'Enviando la orden al equipo (vía GitHub)','El equipo la recoge en menos de 1 minuto: mira su tarjeta de avance en este panel. No pulses de nuevo.',false],
 [/\/api\/aplicar_todo/,'Aplicando tus decisiones en los equipos','Revisa el resumen por equipo. Si algo quedó en amarillo, completa el dato y vuelve a pulsar «Aplicar todo»; si no, sigue con el grupo que se abre ahora.',true],
 [/\/api\/aplicar_local/,'Aplicando decisiones en este equipo','Revisa el resultado en la mesa.',true],
 [/\/api\/estado(\?|$)/,'Reuniendo los casos de todos los equipos','Elige una decisión en el grupo abierto (arriba) y se habilitará «Aplicar todo».',false],
 [/\/api\/para_claude/,'Enviando el texto a Claude','Escribe «revisa» en la conversación con Claude.',false],
 [/\/api\/aplazar/,'Moviendo el grupo','Mira el grupo que quedó abierto.',false],
 [/\/api\/lanzar/,'Lanzando el proceso','Sigue el avance en la barra del panel; no necesitas hacer nada más hasta que termine.',false],
 [/\/api\/cotejo/,'Preparando el cotejo','Se abrirá la pantalla de cotejo: decide cada par.',false],
 [/\/api\/gestion/,'Cambiando de gestión','Elige el siguiente paso de la gestión.',false],
 [/\/api\//,'Ejecutando la acción','Revisa el resultado en pantalla.',false]
];
let tmr=null,t0=0,fin=null,progUrl=null,cur=null;
function $q(s){return box.querySelector(s)}
function pintar(o){box.className=o.cls||'';box.style.display='block';
 box.innerHTML=`<div class="th"><span>${o.titulo}</span><span class="tx" title="cerrar">✕</span></div><div class="td">${o.desc||''}</div><div class="tb"><i style="width:${o.pct}%"></i></div><div class="tp"><span>${o.pctTxt}</span><span>${o.extra||''}</span></div>${o.res?`<div class="tr">${o.res}</div>`:''}${o.sig?`<div class="ts"><b>Siguiente:</b> ${o.sig}</div>`:''}`;
 $q('.tx').onclick=()=>{box.style.display='none';clearInterval(tmr)}}
function seg(){return Math.round((Date.now()-t0)/1000)}
function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function iniciar(titulo,desc,sig,conProg){clearTimeout(fin);clearInterval(tmr);t0=Date.now();cur={titulo,desc,sig,real:null};
 const tick=async()=>{let pct,txt,extra='',desc2=desc;
  if(conProg&&progUrl!==false){try{const r=await fetch('/api/progreso',{cache:'no-store',__silent:1});const p=await r.json();if(p&&p.total){cur.real=p;pct=Math.min(99,Math.round(100*p.hechas/p.total));txt=pct+' % · '+p.hechas+' de '+p.total;desc2=(p.etapa||desc);
     if(p.hechas>0){const eta=Math.round(seg()/p.hechas*(p.total-p.hechas));extra='faltan ≈ '+mmss(eta)}}}catch(e){}}
  if(pct===undefined){const s=seg();pct=Math.min(95,Math.round(95*(1-Math.exp(-s/25))));txt='≈ '+pct+' % (estimado)';extra='transcurrido '+mmss(s)}
  pintar({titulo:'⏳ '+titulo,desc:desc2,pct,pctTxt:txt,extra,sig:'cuando termine te digo qué hacer.'})};
 tick();tmr=setInterval(tick,1500)}
function terminar(ok,res,sig,det){clearInterval(tmr);
 pintar({cls:ok?'ok':'mal',titulo:(ok?'✅ ':'⚠️ ')+(cur?cur.titulo:'Tarea'),desc:det||'',pct:ok?100:Math.max(5,0),pctTxt:ok?'100 %':'detenida',extra:'duró '+mmss(seg()),res,sig});
 cur=null;if(ok){fin=setTimeout(()=>{box.style.display='none'},20000)}}
const F0=window.fetch.bind(window);
window.fetch=async function(u,o){const url=String(typeof u==='string'?u:(u&&u.url)||'');const silent=(o&&o.__silent)||SILENT.some(r=>r.test(url));
 const m=MAPA.find(x=>x[0].test(url));
 const esPost=o&&/^(POST|PUT|PATCH|DELETE)$/i.test(String(o.method||''));
 if(silent||!m||(!esPost&&!/\/api\/estado(\?|$)/.test(url)))return F0(u,o);
 /* una tarea a la vez en la tarjeta: la nueva reemplaza el título */
 iniciar(m[1],'Enviada la orden; esperando respuesta…',m[2],m[3]);
 try{const r=await F0(u,o);let j=null;try{j=await r.clone().json()}catch(e){}
  const err=(j&&(j.error||j.ok===false))?(j.error||j.msg||'la acción no se pudo completar'):(!r.ok?('HTTP '+r.status):null);
  if(err)terminar(false,'No se completó: '+String(err).slice(0,300),'Corrige lo indicado y vuelve a pulsar el botón. Si se repite, copia este aviso y pégalo en la conversación con Claude.');
  else{let det='';if(j&&Array.isArray(j.equipos)&&j.equipos.length&&j.equipos[0].ok!==undefined&&j.equipos[0].n!==undefined)det=j.equipos.map(e=>e.equipo+': '+e.ok+' de '+e.n).join(' · ');
   const piden=j&&Array.isArray(j.equipos)?j.equipos.reduce((a,e)=>a+((e.piden||[]).length),0):0;
   terminar(true,piden?('Hecho, pero '+piden+' caso(s) esperan un dato tuyo'):'Hecho: terminó correctamente',piden?'completa el dato en los casos marcados en amarillo y vuelve a pulsar «Aplicar todo».':m[2],det)}
  return r}catch(e){terminar(false,'No se pudo conectar: '+e.message,'Comprueba que el programa siga abierto en este equipo y que Tailscale esté conectado; luego vuelve a pulsar el botón.');throw e}};
/* TODO botón da acuse inmediato aunque su acción no use el servidor */
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('button');if(!b||b.closest('#tarea')||b.closest('#tconf'))return;
 const t=(b.textContent||'').trim().slice(0,60)||'acción';const antes=Date.now();
